<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converse Shopping</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <header class="main-header">
        <article class="product">
          <nav>
            <h2 class="product-title">
              Converse Chuck Taylor Ali Star Low Top
            </h2>
          </nav>
          <img
            src="/img/challenges.jpg"
            alt="Converse Chuck Taylor Ali Star Low Top"
            class="challenges-img"
          />
          <p class="price"><strong>$65.00</strong></p>
          <p class="shipping">Free Shipping</p>
          <p class="sale">Sale</p>
          <p>ready to dress up or down</p>
          <a
            class="more-info"
            href="https://www.converse.com/shop/p/chuck-taylor-all-star-low-top-unisex-shoe/M9160.html?size=7&width=M"
            target="_blank"
            >More Info &rarr;
          </a>
          <div class="colors">
            <div class="color"></div>
            <div class="color color-blue"></div>
            <div class="color color-red"></div>
            <div class="color color-yellow"></div>
            <div class="color color-green"></div>
            <div class="color color-brown"></div>
          </div>

          <aside>
            <h3 class="detail-title">Products details</h3>
            <ul class="detail-list">
              <li>
                <a
                  href="https://www.converse.com/shop/p/chuck-taylor-all-star-high-top-unisex-shoe/M9621.html?size=7&width=M"
                  target="_blank"
                  >Converse Chuck Taylor All Star High Top</a
                >
              </li>
              <li>
                <a
                  href="https://www.converse.com/shop/p/chuck-taylor-all-star-low-top-unisex-shoe/M9160.html?size=7&width=M"
                  target="_blank"
                  >Converse Chuck Taylor All Star Low Top</a
                >
              </li>
              <li>
                <a
                  href="https://www.converse.com/shop/p/chuck-taylor-all-star-platform-unisex-shoe/M9161.html?size=7&width=M"
                  target="_blank"
                  >Converse Chuck Taylor All Star Platform</a
                >
              </li>
            </ul>
            <button class="cart">Add To Cart</button>
          </aside>
        </article>
      </header>
    </div>
  </body>
</html>
